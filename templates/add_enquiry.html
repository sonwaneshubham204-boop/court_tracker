<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if edit_mode %}Edit{% else %}Add{% endif %} Enquiry</title>
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
<style>
body{font-family:Cambria,Georgia,serif}
.wrap{max-width:900px;margin:30px auto;padding:0 18px}
.card{background:#fff;padding:25px;border:1px solid #cbd5e1;border-left:5px solid #198754;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{font-weight:bold;display:block;margin-bottom:6px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}
.btn{padding:11px 18px;border:0;border-radius:8px;background:#315989;color:#fff;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.green{background:#198754}
.actions{margin-top:22px;display:flex;gap:10px}
.custom-status{display:none}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>{% if edit_mode %}✏️ Edit Enquiry{% else %}📋 Add New Enquiry{% endif %}</h1>
<div class="card">
<form method="post">
<div class="grid">
    <div>
        <label>Name of Organisation *</label>
        <input name="organisation_name" required value="{{enquiry.organisation_name if enquiry else ''}}">
    </div>
    <div>
        <label>Enquiry Start Date *</label>
        <input type="date" name="start_date" required value="{{enquiry.start_date.isoformat() if enquiry else today.isoformat()}}">
    </div>
    <div>
        <label>Next Enquiry Date</label>
        <input type="date" name="next_enquiry_date" value="{{enquiry.next_enquiry_date.isoformat() if enquiry and enquiry.next_enquiry_date else ''}}">
    </div>
    <div>
        <label>Next Enquiry Time</label>
        <input type="time" name="next_enquiry_time" value="{{enquiry.next_enquiry_time.strftime('%H:%M') if enquiry and enquiry.next_enquiry_time else ''}}">
    </div>
    {% if edit_mode %}
    <div>
        <label>End Date</label>
        <input type="date" name="end_date" value="{{enquiry.end_date.isoformat() if enquiry and enquiry.end_date else ''}}">
    </div>
    {% endif %}
    {% set current_status = enquiry.status if enquiry else 'Pending for Report' %}
    {% set is_custom_status = current_status not in statuses %}
    <div>
        <label>Enq Status</label>
        <select name="status" id="statusSelect">
            {% for s in statuses %}
            <option value="{{s}}" {% if current_status==s %}selected{% endif %}>{{s}}</option>
            {% endfor %}
            <option value="__other__" {% if is_custom_status %}selected{% endif %}>Other</option>
        </select>
    </div>
    <div id="customStatusWrap" class="custom-status" {% if is_custom_status %}style="display:block"{% endif %}>
        <label>Enter Other Status *</label>
        <input id="customStatus" name="custom_status" maxlength="50" placeholder="Enter custom enquiry status..." value="{{ current_status if is_custom_status else '' }}">
    </div>
</div>
<div class="actions">
<button class="btn green">{% if edit_mode %}Save Changes{% else %}Add Enquiry{% endif %}</button>
<a class="btn" href="{{ url_for('enquiry_detail',id=enquiry.id) if enquiry else url_for('enquiry_list') }}">Cancel</a>
</div>
</form>
</div>
</div>
<script>
(function(){
    const select=document.getElementById('statusSelect');
    const wrap=document.getElementById('customStatusWrap');
    const input=document.getElementById('customStatus');
    function toggleCustom(){
        const isOther=select.value==='__other__';
        wrap.style.display=isOther?'block':'none';
        input.required=isOther;
        if(!isOther) input.value='';
        if(isOther) input.focus();
    }
    select.addEventListener('change',toggleCustom);
    toggleCustom();
})();
</script>
</body>
</html>
