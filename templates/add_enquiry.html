<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if edit_mode %}Edit{% else %}Add{% endif %} Enquiry</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><style>body{font-family:Cambria,Georgia,serif}.wrap{max-width:900px;margin:30px auto;padding:0 18px}.card{background:#fff;padding:25px;border:1px solid #cbd5e1;border-left:5px solid #198754;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{font-weight:bold;display:block;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.btn{padding:11px 18px;border:0;border-radius:8px;background:#315989;color:#fff;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.green{background:#198754}.actions{margin-top:22px;display:flex;gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>{% if edit_mode %}✏️ Edit Enquiry{% else %}📋 Add New Enquiry{% endif %}</h1><div class="card"><form method="post"><div class="grid"><div><label>Name of Organisation *</label><input name="organisation_name" required value="{{enquiry.organisation_name if enquiry else ''}}"></div><div><label>Enquiry Start Date *</label><input type="date" name="start_date" required value="{{enquiry.start_date.isoformat() if enquiry else today.isoformat()}}"></div><div><label>Next Enquiry Date</label><input type="date" name="next_enquiry_date" value="{{enquiry.next_enquiry_date.isoformat() if enquiry and enquiry.next_enquiry_date else ''}}"></div><div><label>Next Enquiry Time</label><input type="time" name="next_enquiry_time" value="{{enquiry.next_enquiry_time.strftime('%H:%M') if enquiry and enquiry.next_enquiry_time else ''}}"></div>{% if edit_mode %}<div><label>End Date</label><input type="date" name="end_date" value="{{enquiry.end_date.isoformat() if enquiry and enquiry.end_date else ''}}"></div>{% endif %}<div><label>Enq Status</label><select name="status">{% for s in statuses %}<option {% if enquiry and enquiry.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></div></div><div class="actions"><button class="btn green">{% if edit_mode %}Save Changes{% else %}Add Enquiry{% endif %}</button><a class="btn" href="{{ url_for('enquiry_detail',id=enquiry.id) if enquiry else url_for('enquiry_list') }}">Cancel</a></div></form></div></div></body></html>
