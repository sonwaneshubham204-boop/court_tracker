<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Tracker Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 20px;
            border: 1px solid #cfd6dd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
        }

        .message {
            padding: 11px 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .message.success {
            background: #e8f7ec;
            color: #1f6b35;
        }

        .message.warning {
            background: #fff5db;
            color: #7a5900;
        }

        .message.danger {
            background: #fdeaea;
            color: #9b1c1c;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <main class="login-card">
        <h1>Court Tracker</h1>
        <p class="subtitle">Please log in to continue</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                autofocus
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">Login</button>

        </form>
    </main>

</body>
</html>
